<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>筛选原型</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#ece9e4;font-family:"Microsoft YaHei",sans-serif}.app{width:570px;min-height:860px;background:#c9c6c1;border-radius:32px;padding:36px;color:#fff;box-shadow:0 20px 40px rgba(0,0,0,.12);display:flex;flex-direction:column}.top{display:flex;justify-content:space-between}.en{font-size:12px;letter-spacing:.35em;opacity:.8}.cn{font-size:54px;font-weight:900;margin:10px 0 24px}.logo{width:74px;height:74px;border:8px solid #fff;display:grid;place-items:center;font-size:42px;font-weight:900}.fold{width:100%;background:transparent;border:2px solid #fff;border-radius:20px;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;margin:10px 0}.meta small{display:block;font-size:11px;letter-spacing:.2em;opacity:.8;margin-bottom:6px}.meta strong{font-size:22px;letter-spacing:.12em}.arrow{width:18px;height:18px;border-right:4px solid #fff;border-bottom:4px solid #fff;transform:rotate(45deg)}.fold.open .arrow{transform:rotate(-135deg)}.drop{display:none;border:2px solid #fff;border-radius:18px;padding:12px;margin-top:-2px;margin-bottom:14px}.drop.show{display:block}.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.col{display:none;background:rgba(255,255,255,.12);border-radius:12px;overflow-y:auto;overflow-x:hidden;height:170px;min-height:170px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.55) transparent}.col.show{display:block}.item{width:100%;background:transparent;border:0;color:#fff;padding:10px 12px;display:flex;justify-content:space-between;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.08)}.item:hover{background:rgba(255,255,255,.08)}.item.active{background:rgba(255,255,255,.15)}.item.sel{background:rgba(255,255,255,.2)}.actions{display:flex;align-items:center;gap:8px}.pick{font-size:13px;border:1px solid rgba(255,255,255,.72);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:2px 8px;cursor:pointer}.pick:hover{background:rgba(255,255,255,.15)}.next{font-size:18px;opacity:.9}.tick{color:#f4ec69;font-weight:900}.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pill,.sp{border:2px solid #fff;border-radius:999px;color:#fff;min-height:34px;padding:0 14px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}.pill{cursor:pointer}.pill.sel{background:rgba(255,255,255,.18)}.selbox{margin:26px 0 30px;min-height:160px}.st{font-size:14px;letter-spacing:.35em;opacity:.7;margin-bottom:12px}.sub{font-size:12px;letter-spacing:.18em;opacity:.7;width:100%;margin:10px 0 6px}.row{display:flex;flex-wrap:wrap;gap:10px}.sp button{border:0;background:transparent;color:#fff;cursor:pointer;font-size:14px}.col::-webkit-scrollbar{width:6px}.col::-webkit-scrollbar-thumb{background:rgba(255,255,255,.5);border-radius:999px}.col::-webkit-scrollbar-track{background:transparent}.bottom{display:flex;gap:24px;justify-content:center;margin-top:auto;padding-top:20px}.reset,.apply{height:90px;border-radius:22px;font-size:26px;font-weight:900;cursor:pointer}.reset{width:144px;border:4px solid #7c7c7c;color:#777;background:transparent}.apply{width:256px;border:4px solid #fff;background:linear-gradient(#efefef,#d7d7d7);color:#fff;box-shadow:0 8px 16px rgba(0,0,0,.12)}</style></head><body><div class='app'><div class='top'><div><div class='en'>Material Curation</div><div class='cn'>素材甄选</div></div><div class='logo'>甄</div></div><button id='rf' class='fold'><div class='meta'><small>Recipient</small><strong>赠送对象</strong></div><div class='arrow'></div></button><div id='rd' class='drop'><div class='rgrid'><div id='c1' class='col'></div><div id='c2' class='col'></div><div id='c3' class='col'></div></div></div><button id='pf' class='fold'><div class='meta'><small>Political Connotation</small><strong>政治意向</strong></div><div class='arrow'></div></button><div id='pd' class='drop'><div id='pg' class='pgrid'></div></div><div class='selbox'><div class='st'>已选条件</div><div class='sub'>赠送对象</div><div id='sr' class='row'></div><div class='sub'>政治意向</div><div id='sp' class='row'></div></div><div class='bottom'><button id='reset' class='reset'>重置</button><button id='apply' class='apply'>应用筛选</button></div></div><script>const tree=[{id:'global',label:'国际通用',s:1,c:[]},{id:'continent',label:'大洲',s:0,c:[{id:'asia',label:'亚洲',s:1,c:[{id:'jp',label:'日本',s:1,c:[]},{id:'nk',label:'朝鲜',s:1,c:[]},{id:'kr',label:'韩国',s:1,c:[]},{id:'in',label:'印度',s:1,c:[]},{id:'th',label:'泰国',s:1,c:[]}]},{id:'af',label:'非洲',s:1,c:[{id:'eg',label:'埃及',s:1,c:[]},{id:'za',label:'南非',s:1,c:[]},{id:'et',label:'埃塞俄比亚',s:1,c:[]},{id:'ng',label:'尼日利亚',s:1,c:[]}]},{id:'na',label:'北美洲',s:1,c:[{id:'us',label:'美国',s:1,c:[]},{id:'ca',label:'加拿大',s:1,c:[]},{id:'mx',label:'墨西哥',s:1,c:[]}]},{id:'sa',label:'南美洲',s:1,c:[{id:'br',label:'巴西',s:1,c:[]},{id:'ar',label:'阿根廷',s:1,c:[]},{id:'cl',label:'智利',s:1,c:[]},{id:'pe',label:'秘鲁',s:1,c:[]}]},{id:'eu',label:'欧洲',s:1,c:[{id:'uk',label:'英国',s:1,c:[]},{id:'fr',label:'法国',s:1,c:[]},{id:'de',label:'德国',s:1,c:[]},{id:'it',label:'意大利',s:1,c:[]},{id:'ru',label:'俄罗斯',s:1,c:[]}]}]},{id:'org',label:'国际组织',s:0,c:[{id:'asean',label:'东盟',s:1,c:[]},{id:'un',label:'联合国',s:1,c:[]},{id:'sco',label:'上合组织',s:1,c:[]}]}],politics=['合作共赢','文化交流','国家形象','经贸合作','友好往来','历史共鸣','礼仪表达','文明互鉴','区域协同'];let open='',a1=null,a2=null;const rec=new Map(),pol=new Set();const $=id=>document.getElementById(id),rf=$('rf'),rd=$('rd'),pf=$('pf'),pd=$('pd'),c1=$('c1'),c2=$('c2'),c3=$('c3'),pg=$('pg'),sr=$('sr'),sp=$('sp');function sync(){rd.classList.toggle('show',open==='r');pd.classList.toggle('show',open==='p');rf.classList.toggle('open',open==='r');pf.classList.toggle('open',open==='p')}function toggleRec(n){rec.has(n.id)?rec.delete(n.id):rec.set(n.id,n.label)}function makeItem(n,l,active){const b=document.createElement('div');b.className='item'+(active?' active':'')+(rec.has(n.id)&&n.s?' sel':'');const left=document.createElement('span');left.textContent=n.label;const actions=document.createElement('div');actions.className='actions';if(n.s){const pick=document.createElement('button');pick.className='pick';pick.textContent=rec.has(n.id)?'已选':'选择';pick.onclick=e=>{e.stopPropagation();toggleRec(n);renderRec();renderSel()};actions.appendChild(pick)}if(n.c&&n.c.length){const next=document.createElement('span');next.className=rec.has(n.id)&&n.s?'tick next':'next';next.textContent='›';actions.appendChild(next);b.onclick=()=>{if(l===1){a1=n;a2=null}else if(l===2){a2=n}renderRec()}}left.style.pointerEvents='none';b.append(left,actions);return b}function renderRec(){c1.innerHTML='';c2.innerHTML='';c3.innerHTML='';c1.classList.add('show');tree.forEach(n=>c1.appendChild(makeItem(n,1,a1&&a1.id===n.id)));if(a1&&a1.c&&a1.c.length){c2.classList.add('show');a1.c.forEach(n=>c2.appendChild(makeItem(n,2,a2&&a2.id===n.id)))}else c2.classList.remove('show');if(a2&&a2.c&&a2.c.length){c3.classList.add('show');a2.c.forEach(n=>c3.appendChild(makeItem(n,3,false)))}else c3.classList.remove('show')}function renderPol(){pg.innerHTML='';politics.forEach(t=>{const b=document.createElement('button');b.className='pill'+(pol.has(t)?' sel':'');b.textContent=t;b.onclick=()=>{pol.has(t)?pol.delete(t):pol.add(t);renderPol();renderSel()};pg.appendChild(b)})}function selPill(t,cb){const d=document.createElement('div');d.className='sp';const s=document.createElement('span');s.textContent=t;const b=document.createElement('button');b.textContent='×';b.onclick=cb;d.append(s,b);return d}function renderSel(){sr.innerHTML='';sp.innerHTML='';rec.forEach((label,key)=>sr.appendChild(selPill(label,()=>{rec.delete(key);renderRec();renderSel()})));[...pol].forEach(t=>sp.appendChild(selPill(t,()=>{pol.delete(t);renderPol();renderSel()})))}rf.onclick=()=>{open=open==='r'?'':'r';sync()};pf.onclick=()=>{open=open==='p'?'':'p';sync()};$('reset').onclick=()=>{open='';a1=null;a2=null;rec.clear();pol.clear();sync();renderRec();renderPol();renderSel()};$('apply').onclick=()=>alert(JSON.stringify({recipients:[...rec.values()],politicalGoals:[...pol.values()]},null,2));renderRec();renderPol();renderSel();sync();</script></body></html>
